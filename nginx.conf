events {
  worker_connections 1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","request_id":"$request_id","user":"$upstream_http_x_auth_user","user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;
  client_max_body_size 250m;
  sendfile        on;
  server_tokens   off;
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types      text/plain text/css text/xml text/javascript
                  application/javascript application/xml
                  application/xml+rss application/json image/svg+xml;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  upstream backend {
    server backend:5000;
  }

  server {
    listen      80;
    server_name civiliererp.in www.civiliererp.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    # HTTP/2: one connection carries every request at once. Over HTTP/1.1 the browser opens 6 connections per
    # site, each with its own TLS handshake, and the 30-40 requests of a page load (Home alone makes ~37 API
    # calls) queue behind each other — a slow list blocks a fast one. (The "http2" flag on listen works on every
    # nginx version; newer ones prefer a separate "http2 on;" line but still accept this.)
    listen      443 ssl http2;
    server_name civiliererp.in www.civiliererp.in;

    ssl_certificate     /etc/letsencrypt/live/civiliererp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civiliererp.in/privkey.pem;

    root        /usr/share/nginx/html;
    index       index.html;

    # index.html — never cached so deployments are picked up immediately
    location = /index.html {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }
    # Hashed assets — cache forever
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    # Unhashed static files in public/ (logos, mascots, loader, favicons) —
    # filenames don't change on deploy, so cache for a month; not immutable
    # since a changed file under the same name should still get picked up
    # once the cache expires.
    location ~* \.(?:png|jpe?g|webp|gif|svg|ico|woff2?|ttf|eot)$ {
      add_header Cache-Control "public, max-age=2592000";
      try_files $uri =404;
    }
    # Frontend SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
    # APK releases — served straight from the host bind mount (./apk-releases),
    # independent of the frontend build/deploy. autoindex off so the folder
    # listing itself isn't browsable, only files whose exact name is linked.
    location /downloads/ {
      alias                  /var/www/apk-releases/;
      autoindex               off;
      add_header Cache-Control "no-store";
    }
    # Backend REST API
    location /api/ {
      proxy_pass             http://backend/api/;
      proxy_http_version     1.1;
      # The backend names the signed-in person in X-Auth-User so the access log can show who sent a request
      # ($upstream_http_x_auth_user in log_format above). It is for the log only: never sent on to the browser.
      proxy_hide_header      X-Auth-User;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }
    # Socket.IO — WebSocket upgrade, no buffering, dynamic Connection header
    location /socket.io/ {
      proxy_pass             http://backend/socket.io/;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade            $http_upgrade;
      proxy_set_header       Connection         $connection_upgrade;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }
    # Backend health probes — suppress access logsre
    location /health/ {
      access_log  off;
      proxy_pass  http://backend/health/;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }
    location = /health {
      access_log  off;
      proxy_pass  http://backend/health;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }
  }
}
