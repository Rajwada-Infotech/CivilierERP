events {
  worker_connections 1024;
}
http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","request_id":"$request_id","user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;
  client_max_body_size 100m;
  sendfile        on;
  server_tokens   off;
  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types      text/plain text/css text/xml text/javascript
                  application/javascript application/xml
                  application/xml+rss application/json image/svg+xml;
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }
  upstream backend {
    server backend:5000;
  }

  server {
    listen      80;
    server_name civiliererp.in www.civiliererp.in;

    location /.well-known/acme-challenge/ {
      root /var/www/certbot;
    }

    location / {
      return 301 https://$host$request_uri;
    }
  }

  server {
    listen      443 ssl;
    server_name civiliererp.in www.civiliererp.in;

    ssl_certificate     /etc/letsencrypt/live/civiliererp.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/civiliererp.in/privkey.pem;

    root        /usr/share/nginx/html;
    index       index.html;

    # index.html — never cached so deployments are picked up immediately
    location = /index.html {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }
    # Hashed assets — cache forever
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }
    # Frontend SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }
    # Backend REST API
    location /api/ {
      proxy_pass             http://backend/api/;
      proxy_http_version     1.1;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }
    # Socket.IO — WebSocket upgrade, no buffering, dynamic Connection header
    location /socket.io/ {
      proxy_pass             http://backend/socket.io/;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade            $http_upgrade;
      proxy_set_header       Connection         $connection_upgrade;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }
    # Backend health probes — suppress access logs
    location /health/ {
      access_log  off;
      proxy_pass  http://backend/health/;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }
    location = /health {
      access_log  off;
      proxy_pass  http://backend/health;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }
  }
}
