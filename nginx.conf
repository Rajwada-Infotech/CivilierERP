events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  log_format json_combined escape=json
    '{"time":"$time_iso8601","remote_addr":"$remote_addr","method":"$request_method","uri":"$request_uri","status":$status,"bytes":$body_bytes_sent,"request_time":$request_time,"upstream_time":"$upstream_response_time","request_id":"$request_id","user_agent":"$http_user_agent"}';
  access_log /var/log/nginx/access.log json_combined;
  error_log  /var/log/nginx/error.log warn;

  sendfile        on;
  server_tokens   off;

  gzip            on;
  gzip_vary       on;
  gzip_min_length 1024;
  gzip_proxied    any;
  gzip_comp_level 6;
  gzip_types      text/plain text/css text/xml text/javascript
                  application/javascript application/xml
                  application/xml+rss application/json image/svg+xml;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
  }

  upstream backend {
    server backend:5000;
  }

  # ---------------------------------------------------------------------------
  # 15.3 fix: TLS termination on 443, HTTP → HTTPS redirect on 80
  #
  # Prerequisites (EC2 / self-hosted):
  #   1. Obtain a certificate:
  #        sudo certbot certonly --standalone -d your-domain.com
  #      (or use the nginx plugin: --nginx -d your-domain.com)
  #   2. Replace "your-domain.com" in server_name and ssl_certificate paths
  #      below with your actual domain.
  #   3. Certbot auto-renewal: verify `systemctl status certbot.timer` or
  #      add a cron: `0 3 * * * certbot renew --quiet --post-hook "nginx -s reload"`
  #
  # Docker note: mount the certificate directory into the nginx container:
  #   volumes:
  #     - /etc/letsencrypt:/etc/letsencrypt:ro
  # ---------------------------------------------------------------------------

  # Redirect all plain HTTP to HTTPS
  server {
    listen      80;
    server_name your-domain.com;
    return 301  https://$host$request_uri;
  }

  server {
    listen      443 ssl;
    server_name your-domain.com;

    # TLS certificate (Let's Encrypt / Certbot paths)
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # Modern TLS only — drop TLS 1.0/1.1
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers               HIGH:!aNULL:!MD5;

    # HSTS — tell browsers to always use HTTPS (1 year)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Session resumption — reduces TLS handshake cost on repeat connections
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    root        /usr/share/nginx/html;
    index       index.html;

    # index.html — never cached so deployments are picked up immediately
    location = /index.html {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    # Hashed assets — cache forever
    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
      try_files $uri =404;
    }

    # Frontend SPA fallback
    location / {
      try_files $uri $uri/ /index.html;
    }

    # Backend REST API
    location /api/ {
      proxy_pass             http://backend/api/;
      proxy_http_version     1.1;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }

    # Socket.IO — WebSocket upgrade, no buffering, dynamic Connection header
    location /socket.io/ {
      proxy_pass             http://backend/socket.io/;
      proxy_http_version     1.1;
      proxy_set_header       Upgrade            $http_upgrade;
      proxy_set_header       Connection         $connection_upgrade;
      proxy_set_header       Host               $host;
      proxy_set_header       X-Real-IP          $remote_addr;
      proxy_set_header       X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header       X-Forwarded-Proto  $scheme;
      proxy_set_header       X-Request-Id       $request_id;
      proxy_read_timeout     3600s;
      proxy_connect_timeout  75s;
      proxy_buffering        off;
    }

    # Backend health probes — suppress access logs
    location /health/ {
      access_log  off;
      proxy_pass  http://backend/health/;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }

    location = /health {
      access_log  off;
      proxy_pass  http://backend/health;
      proxy_http_version    1.1;
      proxy_set_header Host               $host;
      proxy_set_header X-Real-IP          $remote_addr;
      proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto  $scheme;
      proxy_set_header X-Request-Id       $request_id;
    }
  }
}