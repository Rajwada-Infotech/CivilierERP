name: CI

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  # Runs on every push/PR to main or dev. Pure validation — never talks to
  # AWS, never touches the EC2 box. Pushing to main only ever triggers this
  # job; nothing deploys automatically.
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Test frontend
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Test backend
        run: npm --prefix backend test

      - name: Check backend JavaScript syntax
        run: |
          find backend \
            -path "backend/node_modules" -prune -o \
            -name "*.js" -print0 | \
          xargs -0 -r -n1 node --check

      - name: Set up Docker Buildx
        # Needed for the GitHub Actions cache backend below (`type=gha`) —
        # the classic `docker compose build` / default builder can't use it.
        uses: docker/setup-buildx-action@v3

      - name: Docker build check
        # Same image docker-compose.yml's `backend` service builds (context
        # ./backend, default Dockerfile) — built directly with buildx here
        # instead of via `docker compose build` so it can use the GitHub
        # Actions cache backend. Previously this rebuilt the image's
        # `npm ci --omit=dev` layer completely from scratch on every single
        # run (~7-8 min alone), regardless of whether backend/package.json
        # had even changed — cache-from/cache-to make that layer reusable
        # across runs, so an unchanged dependency set becomes a cache hit
        # instead of a full reinstall.
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual only — go to the Actions tab, pick this workflow, click
  # "Run workflow", choose the branch, and run. Produces a downloadable
  # .zip of clean source under "Artifacts" on the finished run page.
  # Nothing here uses AWS credentials and nothing here touches the EC2
  # box — that only happens when you manually run
  # scripts/deploy-from-artifact.sh on the box with the downloaded zip.
  build-artifact:
    name: Build downloadable release
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Package clean source tree
        run: |
          mkdir -p release
          git archive --format=tar HEAD | tar -x -C release
          # Sanity check before uploading — fail loudly here rather than
          # shipping a broken or empty artifact.
          test -f release/docker-compose.yml
          test -f release/backend/server.js

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: civilier-source-${{ github.ref_name }}-${{ github.run_number }}
          path: release/
          retention-days: 90
