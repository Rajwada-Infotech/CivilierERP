# Build & Test — runs on every push / PR to main and dev. Pure validation: never talks to AWS, never touches the
# EC2 box, deploys nothing.
#
# Turns the run red only for what would break the app or a deploy: TypeScript errors, a frontend that won't build,
# backend files that won't parse, and (on main) a backend Docker image that won't build. Test failures don't fail the
# run — they're listed as a warning on the run page with the failing tests named, so they get seen and fixed
# without blocking every push. The run page also lists any new database migrations in the push, to run on the server.
#
# A newer push to the same branch cancels the run still going for the older one.
name: Build & Test

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main
      - dev
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  checks:
    name: Typecheck, build and test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # to list the migrations this push adds

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build frontend
        run: npm run build

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Check backend JavaScript syntax
        run: |
          find backend -path "backend/node_modules" -prune -o -name "*.js" -print0 | xargs -0 -r -n1 node --check

      # ── Tests: reported, not blocking ──────────────────────────────────────
      - name: Test frontend
        id: test_frontend
        continue-on-error: true
        run: npm test 2>&1 | tee frontend-test.log; exit ${PIPESTATUS[0]}

      - name: Test backend
        id: test_backend
        continue-on-error: true
        run: npm --prefix backend test 2>&1 | tee backend-test.log; exit ${PIPESTATUS[0]}

      - name: Test report
        if: always()
        run: |
          report() { # $1 label, $2 outcome, $3 log
            if [ "$2" = "success" ]; then
              echo "| $1 | ✅ passed | $(grep -E '^ *Tests:' "$3" | tail -1 | sed 's/^ *Tests: *//') |" >> "$GITHUB_STEP_SUMMARY"
            elif [ "$2" = "skipped" ] || [ ! -f "$3" ]; then
              echo "| $1 | — not run | |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $1 | ⚠️ failing | $(grep -E '^ *Tests:' "$3" | tail -1 | sed 's/^ *Tests: *//') |" >> "$GITHUB_STEP_SUMMARY"
              echo "::warning title=$1 tests failing::$(grep -E '^ *(FAIL|×|✕) ' "$3" | head -5 | paste -sd ' ')"
              FAILED=1
            fi
          }
          echo "### Tests" >> "$GITHUB_STEP_SUMMARY"
          echo "| | Result | Counts |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|---|" >> "$GITHUB_STEP_SUMMARY"
          report "Frontend" "${{ steps.test_frontend.outcome }}" frontend-test.log
          report "Backend" "${{ steps.test_backend.outcome }}" backend-test.log
          if [ -n "${FAILED:-}" ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "<details><summary>Failing tests</summary>" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            grep -hE '^ *(FAIL|●|×|✕) ' frontend-test.log backend-test.log 2>/dev/null | head -40 >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            echo "</details>" >> "$GITHUB_STEP_SUMMARY"
          fi

      # ── New migrations: a reminder of what to run on the server ─────────────
      - name: New migrations in this push
        if: always()
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then BEFORE="$(git rev-parse HEAD~1 2>/dev/null || true)"; fi
          [ -z "$BEFORE" ] && exit 0
          NEW="$(git diff --name-only --diff-filter=A "$BEFORE" HEAD -- 'backend/migrations/*.sql' 'backend/migrations/**/*.sql' | sort)"
          [ -z "$NEW" ] && exit 0
          echo "### New migrations — run these on the server" >> "$GITHUB_STEP_SUMMARY"
          echo "$NEW" | sed 's/^/- `/; s/$/`/' >> "$GITHUB_STEP_SUMMARY"
          echo "::notice title=New migrations::$(echo "$NEW" | xargs -n1 basename | paste -sd ' ')"

      # ── Backend image: only on main (what gets deployed), only when it can change ──
      - name: Did the backend image inputs change?
        id: image_inputs
        if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if git diff --name-only "$BEFORE" HEAD -- backend/Dockerfile backend/.dockerignore backend/package.json backend/package-lock.json | grep -q .; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Docker Buildx
        if: steps.image_inputs.outputs.changed == 'true'
        uses: docker/setup-buildx-action@v3

      - name: Docker build check
        # Same image docker-compose.yml's `backend` service builds (context ./backend, default Dockerfile), with the
        # GitHub Actions layer cache so an unchanged dependency set is a cache hit instead of a full reinstall.
        if: steps.image_inputs.outputs.changed == 'true'
        uses: docker/build-push-action@v6
        env:
          # buildx uploads a "<org>~<repo>~<id>.dockerbuild" record artifact by default — clutters Artifacts. Opt out.
          DOCKER_BUILD_SUMMARY: false
        with:
          context: ./backend
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Manual only — go to the Actions tab, pick this workflow, click
  # "Run workflow", choose the branch, and run. Produces a downloadable
  # .zip of clean source under "Artifacts" on the finished run page.
  # Nothing here uses AWS credentials and nothing here touches the EC2
  # box — that only happens when you manually run
  # scripts/deploy-from-artifact.sh on the box with the downloaded zip.
  build-artifact:
    name: Build downloadable release
    runs-on: ubuntu-latest
    needs: checks
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Package clean source tree
        run: |
          mkdir -p release
          git archive --format=tar HEAD | tar -x -C release
          # Sanity check before uploading — fail loudly here rather than
          # shipping a broken or empty artifact.
          test -f release/docker-compose.yml
          test -f release/backend/server.js

      - name: Stamp build info
        # git archive strips .git entirely, so nothing in the extracted tree
        # can ever say which commit it actually came from — this is exactly
        # what let a stale box pass every "deploy succeeded" check while
        # serving old code with no way to tell. Bake the real commit + build
        # time into both halves of the app so a deploy can VERIFY what
        # actually landed instead of trusting a clean exit code:
        #   - public/version.json -> Vite copies public/ verbatim into
        #     dist/, so this becomes GET /version.json on the live frontend.
        #   - backend/build-info.json -> read by GET /health (see health.js).
        run: |
          COMMIT="${{ github.sha }}"
          BUILT_AT="$(date -u +%FT%TZ)"
          INFO=$(printf '{"commit":"%s","ref":"%s","runNumber":"%s","builtAt":"%s"}' \
            "$COMMIT" "${{ github.ref_name }}" "${{ github.run_number }}" "$BUILT_AT")
          echo "$INFO" | tee release/public/version.json
          echo "$INFO" | tee release/backend/build-info.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: civilier-source-${{ github.ref_name }}-${{ github.run_number }}
          path: release/
          retention-days: 90
