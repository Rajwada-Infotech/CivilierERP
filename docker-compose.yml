services:
  backend:
    build: ./backend
    ports:
      - "5000:5000" # Optional: remove in prod (nginx handles routing)
    env_file:
      - backend/.env
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/health/live",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    env_file:
      - backend/.env   # Reads REDIS_PASSWORD
    volumes:
      - redis_data:/data
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\"",
      ]
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  civilier-network:
    driver: bridge
