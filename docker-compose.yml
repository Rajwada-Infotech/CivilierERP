services:
  frontend-build:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && rm -rf /frontend-dist/* && cp -R dist/. /frontend-dist/"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/frontend-dist
    profiles:
      - build

  backend:
    build: ./backend
    env_file:
      - ${CIVILIER_ENV_FILE:-backend/.env}
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health/live', (r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    env_file:
      - ${CIVILIER_ENV_FILE:-backend/.env}
    volumes:
      - redis_data:/data
    command:
      [
        "sh",
        "-c",
        "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD:?REDIS_PASSWORD is required}\"",
      ]
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep PONG",
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

volumes:
  redis_data:
  frontend_dist:
  frontend_node_modules:
  backend_uploads:

networks:
  civilier-network:
    driver: bridge
