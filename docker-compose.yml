services:
  frontend-build:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run build && rm -rf /frontend-dist/* && cp -R dist/. /frontend-dist/"
    volumes:
      - .:/app
      - frontend_node_modules:/app/node_modules
      - frontend_dist:/frontend-dist
    profiles:
      - build

  backend:
    build: ./backend
    env_file:
      - ${CIVILIER_ENV_FILE:-backend/.env}
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health/live', (r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      # No hardcoded fallback — a weak, documented default here would apply
      # to any environment that forgets to set LOCAL_SA_PASSWORD, and it's
      # reachable from the host via the published 1433 port below. Compose
      # fails fast with a clear error if the var isn't set, instead of
      # silently starting SQL Server with a guessable sa password.
      MSSQL_SA_PASSWORD: ${LOCAL_SA_PASSWORD:?Set LOCAL_SA_PASSWORD in your .env before running docker compose}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          '/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$${MSSQL_SA_PASSWORD}" -C -Q "SELECT 1" || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s

  redis:
    image: redis:7-alpine
    env_file:
      - ${CIVILIER_ENV_FILE:-backend/.env}
    volumes:
      - redis_data:/data
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --requirepass "$${REDIS_PASSWORD:?REDIS_PASSWORD is required}"',
      ]
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$${REDIS_PASSWORD}" --no-auth-warning ping | grep PONG',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - frontend_dist:/usr/share/nginx/html:ro
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
      # APK releases — a plain host folder, not part of the git repo or the
      # frontend build image. Drop/replace .apk files here directly on the
      # EC2 host and nginx serves the new one immediately, no rebuild needed.
      - ./apk-releases:/var/www/apk-releases:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot

volumes:
  redis_data:
  frontend_dist:
  frontend_node_modules:
  backend_uploads:
  sqlserver_data:

networks:
  civilier-network:
    driver: bridge
