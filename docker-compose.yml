# CivilierERP — Docker Compose
# Builds and runs: frontend (nginx), backend (Node/Express), redis
# SQL Server is external — point DB_SERVER at your host in backend/.env
#
# Quick start:
#   cp backend/.env.example backend/.env   # fill in DB_* and JWT_SECRET
#   docker compose up --build -d
#
# The frontend is built inside Docker; no local `npm run build` needed.

services:
  # ── Frontend ────────────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

  # ── Backend ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      # REDIS_PASSWORD is read from backend/.env (set to CIVILIER_REDIS_TEMP_2025)
    expose:
      - "5000"
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://localhost:5000/health/live',(r)=>{process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Redis ────────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    # Password is injected via REDIS_PASSWORD from backend/.env (env_file on backend
    # does not propagate here, so we set it explicitly via the environment block below).
    # The default temp value matches what's written into backend/.env by this setup.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-CIVILIER_REDIS_TEMP_2025}
    command:
      [
        "sh",
        "-c",
        'redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"',
      ]
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'redis-cli -a "$$REDIS_PASSWORD" --no-auth-warning ping | grep -q PONG',
        ]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  redis_data:
  backend_uploads:

networks:
  civilier-network:
    driver: bridge
