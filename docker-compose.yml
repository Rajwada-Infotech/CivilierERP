version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: civilier-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: civilier-backend
    env_file:
      - backend/.env
    environment:
      # Override Redis to use container name (not 127.0.0.1)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # ports:
    #   - "5000:5000"

  nginx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: civilier-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

volumes:
  redis_data:
    driver: local

networks:
  civilier-network:
    driver: bridge
