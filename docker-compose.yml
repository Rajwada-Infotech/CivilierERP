version: "3.9"

services:
  backend:
    build: ./backend
    ports:
      - "5000" # For direct access/debug, remove in prod
    environment:
      - NODE_ENV=production
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    env_file:
      - backend/.env # Your DB creds here
    depends_on:
      - redis
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:5000/",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379" # Local access
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    networks:
      - civilier-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 5

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./dist:/usr/share/nginx/html
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - civilier-network
    restart: unless-stopped

volumes:
  redis_data:

networks:
  civilier-network:
    driver: bridge
