<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CivilierERP</title>
        <meta
            name="description"
            content="CivilierERP — Enterprise Resource Planning Built for Civil Contractors"
        />
        <meta name="author" content="Rajwada Infotech" />

        <!-- Favicon - file placed directly in public/ -->
        <link rel="icon" type="image/png" href="/Civilier.png" />
        <link rel="apple-touch-icon" href="/Civilier.png" />

        <!-- Google Fonts — moved out of index.css's @import, which is
             render-blocking and serializes the fetch (CSS must download and
             parse before the browser even discovers the font stylesheet URL,
             which then has to download and parse before it discovers the
             actual font file URLs — three sequential round-trips). A direct
             <link> here lets the browser discover and start these fetches
             immediately, in parallel with everything else. preconnect warms
             the two Google Fonts origins (the CSS host and the font-file
             host) before either request is even issued. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans:wght@400;500&family=Sora:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />

        <meta property="og:title" content="CivilierERP" />
        <meta
            property="og:description"
            content="Enterprise Resource Planning Built for Civil Contractors"
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />

        <script>
            // Synchronous theme initialization to prevent flash
            (function () {
                var theme = localStorage.getItem("civilier-theme") || "dark";
                var valid = ["dark", "light", "midnight", "sepia", "crimson"];
                if (!valid.includes(theme)) theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
