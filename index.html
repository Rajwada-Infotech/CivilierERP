<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>CivilierERP</title>
        <meta
            name="description"
            content="CivilierERP — Enterprise Resource Planning Built for Civil Contractors"
        />
        <meta name="author" content="Rajwada Infotech" />

        <!-- Favicon - file placed directly in public/ -->
        <link rel="icon" type="image/png" href="/Civilier.png" />
        <link rel="apple-touch-icon" href="/Civilier.png" />

        <!-- Google Fonts — moved out of index.css's @import (which serialized
             the fetch: CSS had to download and parse before the browser even
             discovered the font stylesheet URL). preconnect warms both
             Google Fonts origins immediately. The stylesheet itself is
             loaded non-render-blocking via the preload+swap trick: it starts
             downloading in parallel with everything else, but a plain
             <link rel="stylesheet"> would still hold up first paint until it
             finishes — media="print" makes the browser fetch it at high
             priority without treating it as a render blocker, then the
             onload flips it to "all" once it's actually ready to apply.
             <noscript> covers browsers/crawlers with JS disabled. -->
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            rel="preload"
            as="style"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans:wght@400;500&family=Sora:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
        />
        <link
            rel="stylesheet"
            href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans:wght@400;500&family=Sora:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            media="print"
            onload="this.media='all'"
        />
        <noscript>
            <link
                rel="stylesheet"
                href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Noto+Sans:wght@400;500&family=Sora:wght@300;400;500;600;700;800&family=Fraunces:ital,opsz,wght@0,9..144,300..700;1,9..144,300..700&family=JetBrains+Mono:wght@400;500;600&display=swap"
            />
        </noscript>

        <meta property="og:title" content="CivilierERP" />
        <meta
            property="og:description"
            content="Enterprise Resource Planning Built for Civil Contractors"
        />
        <meta property="og:type" content="website" />
        <meta name="twitter:card" content="summary_large_image" />

        <script>
            // Synchronous theme initialization to prevent flash
            (function () {
                var theme = localStorage.getItem("civilier-theme") || "dark";
                var valid = ["dark", "light", "midnight", "sepia", "crimson"];
                if (!valid.includes(theme)) theme = "dark";
                document.documentElement.setAttribute("data-theme", theme);
            })();
        </script>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
